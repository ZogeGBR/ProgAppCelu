name: freshmarket_app
description: "App de pedidos para FreshMarket, almacén de barrio de Don Ceferino."
publish_to: 'none'
# versión visible + número de compilación (Play Store exige que el número
# suba en cada versión que se publica).
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Llamadas al backend propio (catálogo, pagos, seguimiento, IA).
  http: ^1.2.2
  # Mapa de OpenStreetMap: gratis y sin clave.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Abre el checkout de Mercado Pago (app o navegador).
  url_launcher: ^6.3.1
  # Cámara y galería para cargar productos con una foto.
  image_picker: ^1.1.2
  geolocator: ^14.1.2
  # Guarda el carrito en el celular (datos chicos de clave y valor).
  shared_preferences: ^2.3.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^23.0.0
  # Hora con zona horaria para los avisos programados (zonedSchedule).
  timezone: ^0.11.0
  # Avisar "sin internet" (evento del sistema por Stream).
  connectivity_plus: ^7.0.0
  # Historial de pedidos en el celular (SQLite, con DAO y migraciones).
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Probar el DAO de SQLite con una base en memoria en la computadora.
  sqflite_common_ffi: ^2.3.6
  # Generan el ícono y la pantalla de arranque nativos de Android e iOS
  # (dart run flutter_launcher_icons / dart run flutter_native_splash:create).
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  # Imágenes propias: hay que declararlas acá (y reiniciar, no alcanza con
  # hot reload).
  assets:
    - assets/icono/

# Ícono de la app en Android (adaptativo) e iOS.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icono/icono.png
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: assets/icono/icono_frente.png
  remove_alpha_ios: true
  min_sdk_android: 21

# Pantalla de arranque nativa (lo que se ve mientras Flutter carga).
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icono/logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/icono/logo.png
